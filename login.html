<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Rita Cafetería</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="global.css">
</head>

<body>

    <header>
        <h1>Rita Cafetería</h1>
        <p>Cafetería de Especialidad</p>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="carta.html">Carta</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Ingresar</a>
        </nav>
    </header>

    <main>
        <section class="login">
            <h2>Iniciar sesión</h2>
            <p>Ingresá tus datos para acceder a tu cuenta.</p>

            <form>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password">

                <button type="button">Ingresar</button>
            </form>

            <p class="aviso">El inicio de sesión todavía no está disponible.</p>
        </section>
    </main>

    <footer>
        <p>Rita Cafetería</p>
        <p>Córdoba, Argentina</p>
    </footer>

</body>

</html>
